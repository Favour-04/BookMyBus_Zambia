<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing | BookMyBus Zambia</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container flex items-center justify-center min-h-screen">
    <div class="max-w-md mx-auto p-8 bg-surface-container-lowest rounded-xl shadow-xl text-center space-y-6">
        <span class="material-symbols-outlined text-primary text-6xl animate-spin">sync</span>
        <h1 class="text-3xl font-black font-headline tracking-tight text-on-surface">Processing Your Payment...</h1>
        <p class="text-on-surface-variant font-medium">Please check your phone for a USSD prompt to complete the transaction.</p>
        <p class="text-sm text-on-surface-variant">Do not close this window. You will be redirected once the payment is confirmed.</p>
        <div id="payment-details" class="text-xs text-on-surface-variant mt-4"></div>
        <a href="/" class="inline-block mt-6 px-6 py-3 rounded-xl bg-gradient-to-br from-primary to-primary-container text-white font-headline font-bold text-lg shadow-lg hover:shadow-primary/20 transition-all active:scale-[0.98]">
            Go to Homepage
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bookingId = urlParams.get('booking_id');
            const paymentMethod = urlParams.get('payment_method');
            const amount = urlParams.get('amount');

            const paymentDetailsDiv = document.getElementById('payment-details');
            if (bookingId && paymentMethod && amount) {
                paymentDetailsDiv.innerHTML = `Booking ID: ${bookingId}<br>Payment Method: ${paymentMethod.replace('_', ' ').toUpperCase()}<br>Amount: K${amount}`;
            }

            // Simulate polling for payment status and then redirect to success or failure page
            setTimeout(() => {
                // In a real application, you would poll a backend endpoint like /api/payment/status/{bookingId}
                // and redirect based on the actual payment status.
                const isPaymentSuccessful = Math.random() > 0.3; // Simulate 70% success rate

                if (isPaymentSuccessful) {
                    window.location.href = 'payment-success.html?booking_id=' + bookingId;
                } else {
                    window.location.href = 'payment-failure.html?booking_id=' + bookingId + '&amount=' + amount;
                }
            }, 5000); // Simulate 5 seconds for payment processing
        });
    </script>
</body>
</html>
